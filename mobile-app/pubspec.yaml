name: geostamp_pro
description: GeoStamp Pro – GPS Timestamp Camera & Editor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  image: ^4.3.0
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  photo_view: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
